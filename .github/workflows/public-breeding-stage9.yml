name: Public Breeding Stage 9 Frozen Source and Symbolic QA

on:
  push:
    branches:
      - research/2026-10-24-ijio-response-audit
    paths:
      - 'checkpoints/2026-10-25/31_stage9_reproducibility/**'
      - '.github/workflows/public-breeding-stage9.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-breeding-stage9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce-frozen-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exactly specified symbolic dependency
        run: python -m pip install -r checkpoints/2026-10-25/31_stage9_reproducibility/requirements.txt
      - name: Verify Stage 8 source integrity and run existing independent regression scripts
        run: python checkpoints/2026-10-25/31_stage9_reproducibility/verify_all.py
