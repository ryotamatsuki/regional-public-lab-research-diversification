name: Public Breeding JAFIO Submission QA
on:
  push:
    branches: [research/2026-10-24-ijio-response-audit]
    paths:
      - 'checkpoints/2026-10-25/43_jafio_submission_optimization/**'
      - '.github/workflows/public-breeding-jafio.yml'
  pull_request:
    paths:
      - 'checkpoints/2026-10-25/43_jafio_submission_optimization/**'
      - '.github/workflows/public-breeding-jafio.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-breeding-jafio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  manuscript-and-symbolic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.13.3
      - name: Verify frozen theorem scope and independently reconstruct primitives
        run: python checkpoints/2026-10-25/43_jafio_submission_optimization/verify_jafio.py
      - name: Clean LaTeX and BibTeX build of JAFIO review manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: paper.tex
          working_directory: checkpoints/2026-10-25/43_jafio_submission_optimization
          work_in_root_file_dir: true
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Check built PDF and create anonymous LaTeX source package
        shell: bash
        run: |
          set -euo pipefail
          python checkpoints/2026-10-25/43_jafio_submission_optimization/verify_jafio.py
          cd checkpoints/2026-10-25/43_jafio_submission_optimization
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('JAFIO_LaTeX_Submission.zip', 'w', ZIP_DEFLATED) as archive:
              for source, target in [('paper.tex','paper.tex'), ('references.bib','references.bib'), ('SUBMISSION_README.md','README.md')]:
                  text = Path(source).read_text()
                  for token in ['ryotamatsuki', 'github.com/', '/workspace/', 'checkpoints/']:
                      assert token not in text.lower(), (source, token)
                  archive.write(source, target)
          print('Anonymous source package created; external author/policy approval still required')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: regional-public-breeding-jafio-review-and-source
          path: |
            checkpoints/2026-10-25/43_jafio_submission_optimization/paper.pdf
            checkpoints/2026-10-25/43_jafio_submission_optimization/paper.log
            checkpoints/2026-10-25/43_jafio_submission_optimization/paper.bbl
            checkpoints/2026-10-25/43_jafio_submission_optimization/JAFIO_LaTeX_Submission.zip
          retention-days: 30
  lean-proof-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap elan and resolve Lake dependencies
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          cd checkpoints/2026-10-24/18_lean_formal_proofs/lean
          lake update
      - name: Build unchanged Lean proof-critical core and audit axioms
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: checkpoints/2026-10-24/18_lean_formal_proofs/lean
          build: true
          test: false
          axiom-audit: true
