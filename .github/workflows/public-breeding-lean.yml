name: Public Breeding Lean Proof Audit

on:
  push:
    branches:
      - research/2026-10-24-ijio-response-audit
    paths:
      - 'checkpoints/2026-10-24/18_lean_formal_proofs/**'
      - '.github/workflows/public-breeding-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-proof-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Lean 4/mathlib proof cores and audit axioms
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: checkpoints/2026-10-24/18_lean_formal_proofs/lean
          build: true
          test: false
          axiom-audit: true
